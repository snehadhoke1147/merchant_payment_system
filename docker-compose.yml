services:
  postgres:
    image: postgres:17
    container_name: merchant-payment-postgres
    environment:
      POSTGRES_DB: merchant_payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d merchant_payment"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    container_name: merchant-payment-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/merchant_payment
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-secret-key-to-a-long-random-value-32chars
    ports:
      - "8080:8080"
volumes:
  postgres_data:
