name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: merchant_payment
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d merchant_payment"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/merchant_payment
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: change-this-secret-key-to-a-long-random-value-32chars
